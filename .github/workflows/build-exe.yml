name: Build FastGaji EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller pycryptodome web3 requests

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name FastGaji ^
            --add-data "fastgaji.db;." ^
            --collect-all web3 ^
            --collect-all eth_utils ^
            fastgaji.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FastGaji-Windows
          path: dist/FastGaji.exe
